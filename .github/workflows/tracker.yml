name: tracker

on:
  schedule:
    - cron: '17 9 * * *'   # 02:17 America/Los_Angeles, after the day rolls over UTC
  workflow_dispatch:        # manual run, for testing

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet pillow numpy fonttools brotli

      - name: Fetch contributions and render
        env:
          GH_USER: Mr-Shine09
          # PAT with read:user. The default GITHUB_TOKEN cannot read
          # contributionsCollection, so this secret is required.
          GH_TOKEN: ${{ secrets.TRACKER_TOKEN }}
        run: |
          python tools/fetch_contributions.py > /tmp/stats.json
          python tools/build_tracker.py assets/tracker.svg < /tmp/stats.json

      - name: Commit if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/tracker.svg
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh tracker [skip ci]"
            git push
          fi
